# Alembic configuration for the family-history API.
#
# Prefer `python -m family_history.cli migrate`, which reads DIRECT_DATABASE_URL and locates the
# migrations inside the installed package. This file serves ad-hoc Alembic commands run from
# `api/` (for example `alembic history`); env.py also reads DIRECT_DATABASE_URL, never this file.

[alembic]
script_location = %(here)s/src/family_history/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
