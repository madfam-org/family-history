[project]
name = "family-history-api"
version = "0.1.0"
description = "family-history API: evidence-based family trees and family memory (AGPL-3.0-only)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Innovaciones MADFAM S.A.S. de C.V." }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    # SQLAlchemy 2.1 changes Select/Row typing and breaks strict mypy across the estate.
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.15.1,<3",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
    "boto3>=1.34,<2",
    "celery[redis]>=5.4,<6",
    "python-multipart>=0.0.9,<1",
    "pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-boto3>=1.0",
]

[project.scripts]
family-history-api = "family_history.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/family_history"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# pytest uses assert; tests build scenarios that security lints flag.
"tests/**" = ["S101", "S105", "S106"]
# Autogenerated Alembic operations keep one constraint per line; RLS DDL is built from constants.
"src/family_history/migrations/versions/*" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a real Postgres; runs only when FH_TEST_DATABASE_URL is set",
]
