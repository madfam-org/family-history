# CI for family-history (public repository).
#
# GitHub-hosted runners only, pinned to ubuntu-24.04: fork pull requests must never reach MADFAM's
# self-hosted runners, and `ubuntu-latest` moves to a new image on 2026-10-19. Every action is
# pinned to a full commit SHA. Jobs for parts of the repo that do not exist yet skip themselves,
# so the same workflow serves the scaffold and the full build.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy src
      - name: Test (pytest)
        run: pytest -q

  web:
    name: Web (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect web app
        id: detect
        run: |
          if [ -f apps/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Install (pnpm via corepack)
        if: steps.detect.outputs.present == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, build
        if: steps.detect.outputs.present == 'true'
        run: |
          pnpm --filter @family-history/web run lint
          pnpm --filter @family-history/web run typecheck
          pnpm --filter @family-history/web run test
          pnpm --filter @family-history/web run build
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "apps/web does not exist yet; web job skipped."

  agent-docs:
    name: Agent docs and boundary markers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Required files and markers
        run: |
          set -euo pipefail
          for f in AGENTS.md CLAUDE.md llms.txt llms-full.txt LICENSE; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          grep -q '<!-- MADFAM-AGENTS-CANONICAL v1 -->' AGENTS.md
          head -c 2000 AGENTS.md | grep -Eq '^>[[:space:]]*Last Updated:[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$'
          grep -qi 'repo-boundary contract' AGENTS.md
          grep -qi 'canonical agent instructions' CLAUDE.md
          grep -qi 'compatibility' CLAUDE.md
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          echo "agent docs OK"
