name: Build & Deploy

# Caller for Enclii's shared reusable workflow (two services: family-history-api and family-history-web):
# buildx, push to GHCR as :${SHA}, keyless cosign sign and verify, then the kustomize digest pin committed to
# main, which the GitOps sync picks up, and the lifecycle callback that registers each Enclii Release.
#
# Image names are the contract (docs/ARCHITECTURE.md): image_prefix ghcr.io/madfam-org plus the service name
# gives ghcr.io/madfam-org/family-history-api and ghcr.io/madfam-org/family-history-web, the exact `images:`
# entries in infra/k8s/production/kustomization.yaml. Enclii resolves the service from the image's last
# path segment (family-history-api / family-history-web, the Service documents in enclii.yaml) and accepts it
# only for this repository.
#
# The ref is a full commit SHA, the peeled commit of enclii tag v1.0.0-alpha.14, so what runs cannot change
# under us; the reusable workflow's pin job accepts a SHA caller's signer identity when the SHA is on enclii
# main or is a v* tag commit. To bump: take a release tag's peeled commit
# (`git ls-remote https://github.com/madfam-org/enclii 'refs/tags/vX.Y.Z^{}'`), read the diff of
# .github/workflows/build-publish.yml from the current SHA to it, re-check the named secrets below against
# its `on.workflow_call.secrets`, then change the SHA and its comment together.
#
# BLOCKER BEFORE THE FIRST DISPATCH: this repository requires every action to be pinned to a full commit SHA,
# and the policy reaches inside called reusable workflows. build-publish.yml at this SHA (and on enclii main
# as of 2026-10-01) still uses tag-pinned actions (actions/checkout@v7, docker/*, sigstore/cosign-installer),
# so GitHub refuses the run before any job starts. Bump this pin to an Enclii commit whose build-publish pins
# its actions by SHA (docs/DEPLOYMENT.md, "First deploy").
#
# DISPATCH ONLY for now. Push-on-main (with `paths-ignore: ['**.md', 'docs/**']`) is switched on in its own
# pull request once the project is onboarded to Enclii (docs/DEPLOYMENT.md). Until then nothing deploys by
# itself, and a dispatch before onboarding only builds and pins images nobody runs.
on:
  workflow_dispatch:
    inputs:
      # The reusable workflow reads this from the dispatch event and builds exactly these services, skipping
      # change detection (a dispatch has no push "before" SHA, so detection could silently build nothing).
      services:
        description: Comma-separated services to build
        required: false
        default: family-history-api,family-history-web

concurrency:
  group: family-history-production-kustomization
  cancel-in-progress: false

# Read-only unless a job widens it; only the build-publish call does.
permissions:
  contents: read

jobs:
  build-publish:
    uses: madfam-org/enclii/.github/workflows/build-publish.yml@c0e44a8c373fdf632a0115b145fdb810313fd387 # v1.0.0-alpha.14
    with:
      image_prefix: ghcr.io/madfam-org
      kustomization_path: infra/k8s/production
      # Public repository: GitHub-hosted builders only (the default routes to the self-hosted pool).
      build_runner: ubuntu-24.04
      # `paths` are directories plus exact files. The API builds from api/ as its context; the web builds from
      # the repository root (the pnpm workspace) with apps/web/Dockerfile.
      services: |
        [
          {"name":"family-history-api", "context":"api", "dockerfile":"api/Dockerfile", "paths":"api"},
          {"name":"family-history-web", "dockerfile":"apps/web/Dockerfile", "paths":"apps/web packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .dockerignore"}
        ]
    # Named secrets only, never `inherit`: the reusable workflow sees exactly what is listed here. A public
    # repository sees only the org secrets DOCKER_USERNAME, DOCKER_TOKEN and MADFAM_BOT_PAT, plus its own
    # repository secrets. build-publish.yml declares 8 optional secrets; per secret:
    #   DOCKER_USERNAME, DOCKER_TOKEN  passed (org secrets). Docker Hub login only lifts anonymous pull rate
    #       limits for the base images; soft-fails when absent.
    #   ENCLII_CALLBACK_TOKEN  passed. A REPOSITORY secret the operator sets at onboarding (it is not an org
    #       secret a public repository can see). Without it the step warns and skips, no Enclii Release is
    #       registered, and the services stay at zero replicas while the GitOps sync reports Synced.
    #   GHCR_PAT  not passed. GHCR push, pull and verify use github.token (`packages: write` below) for this
    #       repository's own packages.
    #   ENCLII_COMMIT_TOKEN  not passed. The digest-pin commit uses github.token (`contents: write`). If main
    #       gains branch protection that blocks it, pass MADFAM_BOT_PAT here (org secret) and record why.
    #   ENCLII_DEPLOY_TOKEN  not passed (legacy name for the callback bearer).
    #   ENCLII_API_URL  not passed (defaults to https://api.enclii.dev).
    #   NPM_MADFAM_TOKEN  not passed. The web installs from the public npm registry only.
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      ENCLII_CALLBACK_TOKEN: ${{ secrets.ENCLII_CALLBACK_TOKEN }}
    # `contents: write` for the digest-pin commit to main, `packages: write` to push to GHCR, `id-token: write`
    # for keyless cosign signing and for the pin job to read its own job_workflow_ref claim.
    permissions:
      contents: write
      packages: write
      id-token: write
