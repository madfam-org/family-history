# The API's runtime secrets, by NAME only, from the platform's secret store. Values reach the store only
# through `enclii secrets intake` (docs/DEPLOYMENT.md); never a manifest, a pull request, a CI log or a chat.
# The intake lowercases every key before it writes, so every remote `property:` is lowercase: an upper-case
# property syncs nothing.
#
# Hook-staged at PreSync in an EARLIER wave than the migrate Job (-2 < 0), with no delete policy, so it
# persists and is re-applied on every sync. A Secret created by a Sync-phase resource does not exist yet
# when PreSync hooks run, so the migrate Job (which reads DIRECT_DATABASE_URL from it) would wait forever
# on the first sync.
#
# Every key mapped here must exist in the store before the first sync: an ExternalSecret that maps a
# missing remote property fails, and as a PreSync hook it blocks the whole application's sync.
#
# Explicit conversionStrategy / decodingStrategy / metadataPolicy on every entry: the operator fills these
# defaults in, and leaving them implicit shows up as permanent drift in the GitOps diff.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: family-history-api
  labels:
    app.kubernetes.io/part-of: family-history
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: external-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: family-history-api
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Pooled (PgBouncer, transaction mode): the API's request path.
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/family-history
        property: database_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Direct (unpooled): the migrate Job only. DDL is never trusted to a transaction pooler.
    - secretKey: DIRECT_DATABASE_URL
      remoteRef:
        key: secret/family-history
        property: direct_database_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # The private media bucket (S3-compatible). Originals are immutable and served only through
    # short-lived presigned URLs (docs/PRIVACY.md).
    - secretKey: FH_S3_ENDPOINT
      remoteRef:
        key: secret/family-history
        property: fh_s3_endpoint
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FH_S3_BUCKET
      remoteRef:
        key: secret/family-history
        property: fh_s3_bucket
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FH_S3_ACCESS_KEY_ID
      remoteRef:
        key: secret/family-history
        property: fh_s3_access_key_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FH_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/family-history
        property: fh_s3_secret_access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FH_S3_REGION
      remoteRef:
        key: secret/family-history
        property: fh_s3_region
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Janua subjects or emails let into the early-access app. Personal data, so it lives in the store and
    # never in git. Empty means nobody gets in (fail closed).
    - secretKey: FH_EARLY_ACCESS_ALLOWLIST
      remoteRef:
        key: secret/family-history
        property: fh_early_access_allowlist
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
