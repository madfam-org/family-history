# The API's one store-held secret, by NAME only. Its value reaches the store only through
# `enclii secrets intake` (target family-history/api-access; docs/lanes/platform.md has the full secret map);
# never a manifest, a pull request, a CI log or a chat. The intake lowercases every key before it writes, so
# the remote `property:` is lowercase: an upper-case property syncs nothing.
#
# The database URLs are NOT here: like creator-census, they live in the project Secret
# `family-history-secrets` that `enclii onboard --secret-name family-history-secrets` writes (DATABASE_URL,
# DIRECT_DATABASE_URL). The media bucket's FH_S3_* settings join with media in a later wave; the API treats
# them as optional until then.
#
# Sync-wave -1, a normal Sync-phase resource (not a hook): ArgoCD applies it and waits for it to report Ready
# before the wave-0 Deployment rolls. The migrate hook does not read it. The mapped property must exist in
# the store before the first sync: an ExternalSecret that maps a missing property never becomes Ready.
#
# Explicit conversionStrategy / decodingStrategy / metadataPolicy: the operator fills these defaults in, and
# leaving them implicit shows up as permanent drift in the GitOps diff.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: family-history-api
  labels:
    app.kubernetes.io/part-of: family-history
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: family-history-api
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Janua subjects or emails let into the early-access app. Personal data, so it lives in the store and
    # never in git. Empty means nobody gets in (fail closed).
    - secretKey: FH_EARLY_ACCESS_ALLOWLIST
      remoteRef:
        key: secret/family-history
        property: fh_early_access_allowlist
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
