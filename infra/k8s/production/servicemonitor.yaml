# Scrapes the metrics Services only (service-api-metrics.yaml and service-worker-metrics.yaml, port 9090),
# never the public app's port. `jobLabel` keeps the Prometheus job names the alerts select on
# (family-history-api, family-history-worker).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: family-history
  labels:
    app.kubernetes.io/part-of: family-history
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/part-of: family-history
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - family-history
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
