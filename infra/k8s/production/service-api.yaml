# Named after the Enclii service (enclii.yaml `family-history-api`) on port 80: the tunnel route for
# fh-api.madfam.io is this Service on port 80 (enclii.yaml pins the domain's port to 80). It exposes ONLY the
# public app; /metrics is on Service family-history-api-metrics, so no route can ever name it.
apiVersion: v1
kind: Service
metadata:
  name: family-history-api
  labels:
    app: family-history-api
    app.kubernetes.io/name: family-history-api
    app.kubernetes.io/part-of: family-history
spec:
  selector:
    app.kubernetes.io/name: family-history-api
  ports:
    - name: http
      port: 80
      targetPort: http
