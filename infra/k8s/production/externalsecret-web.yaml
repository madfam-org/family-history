# The web's secrets, by NAME only, from the platform's secret store:
#   - auth_janua_client_id / auth_janua_client_secret: written by Enclii's OIDC provisioner when the
#     confidential client `family-history-web` (janua.client.yaml) is registered. Nobody types them. The id
#     is not a secret, but it is kept out of this public repository all the same.
#   - fh_session_secret: generated inside the secret store by the intake (32 bytes or more). It signs and
#     encrypts the app's own session cookie and is never the Janua client secret.
# The intake lowercases keys before it writes, so every remote property is lowercase.
#
# Sync-wave -1, a normal Sync-phase resource (not a hook): ArgoCD applies it and waits for it to report
# Ready before the wave-0 Deployment rolls, so new web pods start with the Secret present. The Deployment
# still references each key with `optional: true`, so if the store ever fails the public landing keeps
# serving and sign-in is refused, instead of the pod failing to start.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: family-history-web
  labels:
    app.kubernetes.io/part-of: family-history
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: family-history-web
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AUTH_JANUA_CLIENT_ID
      remoteRef:
        key: secret/family-history
        property: auth_janua_client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AUTH_JANUA_CLIENT_SECRET
      remoteRef:
        key: secret/family-history
        property: auth_janua_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FH_SESSION_SECRET
      remoteRef:
        key: secret/family-history
        property: fh_session_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
