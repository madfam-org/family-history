# Janua registrations for family-history. Names only: NO client ids or secrets live here. Ids and secrets
# are created by Enclii's OIDC provisioner and land in the secret store, from which the web's ExternalSecret
# reads them (infra/k8s/production/externalsecret-web.yaml).
#
# Two registrations:
#   1. the API as a resource server (audience family-history-api): it validates Janua RS256 tokens and mints
#      none;
#   2. the web as a confidential client (family-history-web): it signs people in (authorization code with
#      PKCE) and calls the API with their access tokens.

resource_server: family-history-api
client_type: resource_server
audiences:
  - family-history-api
scopes:
  - name: fh:read
    description: Read the family spaces the person belongs to, and the people, events, stories and media in them.
  - name: fh:write
    description: >-
      Create and edit people, relationships, events, citations and stories in a family space where the person is
      a steward, editor or contributor. Implies fh:read.
  - name: fh:export
    description: Export a whole family space (GEDCOM 7 GEDZIP, GEDCOM 5.5.1, native JSON). Free at every tier.
  - name: fh:admin
    description: >-
      Manage a family space's membership, roles and privacy settings. Granted to stewards; implies fh:read and
      fh:write.
token_endpoint: https://auth.madfam.io/api/v1/oauth/token
jwks_uri: https://auth.madfam.io/.well-known/jwks.json
issuer: https://auth.madfam.io

clients:
  - name: family-history-web
    type: confidential
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    # Janua matches redirect URIs exactly: no wildcards, no trailing-slash variants.
    # One redirect URI and no localhost callback: local development registers its own client.
    redirect_uris:
      - https://fh-app.madfam.io/auth/callback
    # Janua keeps no separate post-logout list: RP-initiated logout accepts a registered redirect URI or its
    # origin root, so the callback above admits this and nothing else.
    post_logout_redirect_uris:
      - https://fh-app.madfam.io/
    # offline_access is requested by the web and granted to every sign-in as an identity scope; it is not part
    # of the client's allowed scopes.
    sign_in_scopes:
      - openid
      - email
      - profile
      - offline_access
    # Access tokens are minted for the API's audience with these scopes. The client is allowed exactly
    # `openid profile email fh:read fh:write`. fh:export and fh:admin are defined above but not granted to this
    # client; granting one is a registration change, made when a feature needs it.
    audience: family-history-api
    api_scopes:
      - fh:read
      - fh:write
    secrets_delivered_to:
      target: family-history/web-oidc
      properties:
        - auth_janua_client_id
        - auth_janua_client_secret

notes: |
  Validation (API): RS256 signature against the JWKS, iss == issuer, aud == family-history-api, and the
  route's required scope. Missing or invalid token -> 401; wrong audience or missing scope -> 403. A subject
  outside FH_EARLY_ACCESS_ALLOWLIST gets 403 early_access_required.
  A family space is bound 1:1 to a Janua organization; space roles (steward, editor, contributor, viewer) are
  the API's own records, not Janua scopes.
